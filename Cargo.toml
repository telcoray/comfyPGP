[package]
name = "comfypgp"
version = "0.4.0"
edition = "2024"
description = "A friendly OpenPGP app for Windows"
license = "MIT"
repository = "https://github.com/telcoray/comfyPGP"

[dependencies]
anyhow = "1"
arboard = "3.6"
eframe = "0.36"
pgp = "0.21"
rfd = "0.17"
# CNG backend: uses Windows' native cryptography, no external DLLs.
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-cng", "compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true
